# Opacity table for moment-based lognormal modes of ionised/neutral PAHs:
# each mode looks up kappa(lam; a, sigma). The PAH optical tables only
# cover 3.548e-4 - 0.01 um; the stored untruncated mass fraction shows how
# much of each lognormal lies inside that range.
#
# Run: python create_dustextcurve_draine_li.py --paramfile params/draine_li_pah_lognormal_grid.yaml

output:
  # Defaults to GRID_DIR in synthesizer
  # grid_loc: .
  grid_name: dust_extcurve_draine_li_pah_lognormal_grid

data_dir: .        # where the Draine tables are cached (downloaded if absent)
n_a_int: 500       # log-spaced grain-size integration points per material

# Optional density overrides (g cm^-3); defaults: silicate 3.5, others 2.24
# densities:
#   silicate: 3.5

# The lognormal is defined in number,
#   n(a) = M0 / (sqrt(2 pi) sigma a) exp(-(ln a - mu)^2 / (2 sigma^2)),
# and the a axis is its mass-median radius in micron, so
# mu = ln(a / 1 micron) - 3 sigma^2. Axes are a value, an increasing list,
# or {min, max, n} (log-spaced for a, linear for sigma).
shape: lognormal
materials: [pah_ionised, pah_neutral]
axes:
  a: {min: 0.0004, max: 0.01, n: 15}
  sigma: {min: 0.1, max: 1.0, n: 20}
