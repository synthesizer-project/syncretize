# Opacity tables for moment-based lognormal modes. Each mode of a material
# looks up kappa(lam; a_n, sigma) in that material's table, where the
# lognormal is defined in number,
#   n(a) = M0 / (sqrt(2 pi) sigma a) exp(-(ln a - mu)^2 / (2 sigma^2)),
# and the axis is log10 of the number-median radius a_n = e^mu in micron.
# The table also stores the fraction of each lognormal's mass lying inside
# the optical table's radius range (the rest is renormalised onto it).
#
# Run: python create_dustextcurve_draine_li.py params/draine_li_lognormal_grid.yaml

output:
  # Defaults to GRID_DIR in synthesizer
  # grid_loc: .
  grid_name: dust_extcurve_draine_li_lognormal_grid

data_dir: .
n_a_int: 500

components:
  # Axes as {min, max, n} (linearly spaced) or an explicit increasing list
  - material: silicate
    kind: lognormal_table
    log10_number_median: {min: -3.0, max: 0.0, n: 31}
    sigma: {min: 0.1, max: 1.5, n: 15}
  - material: graphite
    kind: lognormal_table
    log10_number_median: {min: -3.0, max: 0.0, n: 31}
    sigma: {min: 0.1, max: 1.5, n: 15}
  - material: pah_ionised
    kind: lognormal_table
    log10_number_median: {min: -3.4, max: -2.0, n: 15}
    sigma: {min: 0.1, max: 1.0, n: 10}
  - material: pah_neutral
    kind: lognormal_table
    log10_number_median: {min: -3.4, max: -2.0, n: 15}
    sigma: {min: 0.1, max: 1.0, n: 10}
