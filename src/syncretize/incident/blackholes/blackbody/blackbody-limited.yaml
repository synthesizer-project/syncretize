# Parameter file for blackbody/generate_incident_grid.py
#
#   python generate_incident_grid.py blackbody-limited.yaml --grid-dir <grid-dir>
#
#   model: name of the grid; the grid is written to <grid-dir>/<model>.hdf5
#   log10blackbody_temperature: list of log10(T/K), strictly increasing.
#     Cloudy's blackbody command accepts any T; 4.0-6.0 covers stellar and
#     accretion disc temperatures.

model: 'blackbody-limited'
log10blackbody_temperature: [4.0, 4.5, 5.0, 5.5, 6.0]
