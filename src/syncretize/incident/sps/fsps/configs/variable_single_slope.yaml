# FSPS variable single-power-law IMF configuration
#
#   python generate_incident_grid_variable_imf.py --grid-dir <grid-dir> \
#       --config-file fsps/configs/variable_single_slope.yaml
#
# This config defines one slope across the complete IMF mass range:
#
#     dN/dM proportional to M^(-alpha)
#
# The generator applies the same configured value to FSPS imf1, imf2, and
# imf3. FSPS's internal 0.5 and 1.0 Msun breaks therefore have no effect.
# See variable_high_mass_slope.yaml for the keys. Axis points may also be
# generated, e.g.
#
#   - name: imf_slope
#     target: imf_slopes[0]
#     type: linear-range
#     min: 1.3
#     max: 3.0
#     n: 10

Model:
  sps_version: "4.0"
  imf_type: bpl
Constants:
  imf_masses: [0.08, 120.0]
  imf_slopes: [2.3]
Axes:
  - name: imf_slope
    target: imf_slopes[0]
    type: values
    values: [1.3, 1.4, 1.5, 1.6, 1.7, 1.8, 1.9, 2.0, 2.1, 2.2, 2.3, 2.4, 2.5,
             2.6, 2.7, 2.8, 2.9, 3.0]
    log_on_read: false
Sampling:
