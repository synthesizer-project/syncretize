# FSPS variable-IMF grid configuration
#
#   python generate_incident_grid_variable_imf.py --grid-dir <grid-dir> \
#       --config-file fsps/configs/variable_high_mass_slope.yaml
#
# This file defines a contiguous broken power-law initial mass function:
#
#     dN/dM proportional to M^(-alpha_i)
#
# Slopes are ordered. Each slope applies between the mass boundaries at the
# same position and the next position. Four boundaries therefore require three
# slopes. FSPS imf_type=2 fixes the two internal boundaries at 0.5 and 1.0 Msun;
# its lower and upper limits and all three slopes remain configurable.
#
# Model:
#   sps_version, imf_type (only bpl is supported)
#   libraries (optional): the [isochrones, spectra, dust] FSPS must have been
#     compiled with; the script stops if they differ
# Constants:
#   imf_masses: the mass boundaries in Msun
#   imf_slopes: the slopes alpha_i
# Axes (at most one):
#   name: the axis name used by synthesizer
#   target: the entry the axis varies, e.g. imf_slopes[2] or imf_masses[3].
#     Its value in Constants is the nominal one used in the filename and
#     must lie within the axis. Mass-boundary axes are in Msun.
#   type: values (an explicit list, preferred for released grids so every
#     value is visible during review), linear-range or log-range (min, max
#     and n, including both limits)
#   log_on_read: interpolate in log space in synthesizer (default false;
#     separate from the sampling)

Model:
  sps_version: "4.0"
  imf_type: bpl
Constants:
  imf_masses: [0.08, 0.5, 1.0, 120.0]
  imf_slopes: [1.3, 2.3, 2.3]
Axes:
  - name: imf_high_mass_slope
    target: imf_slopes[2]
    type: values
    values: [1.3, 1.4, 1.5, 1.6, 1.7, 1.8, 1.9, 2.0, 2.1, 2.2, 2.3, 2.4, 2.5,
             2.6, 2.7, 2.8, 2.9, 3.0]
    log_on_read: false
Sampling:
