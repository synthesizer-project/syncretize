# Parameter file for maraston/generate_incident_grid_2011.py (Maraston 2011)
#
#   python generate_incident_grid_2011.py --config-file maraston11.yaml \
#       --grid-dir <grid-dir> --input-dir <input-dir>
#
# The source data must be obtained manually and placed in
# <input-dir>/maraston11. These models are for solar metallicity only.
#
# Model:
#   variant: the Pickles library variant, one of standard, nearIRextended,
#     UVtheoretical (salpeter only), UVtheoretical_nearIRextended (salpeter
#     only)
#   imf_type: one of salpeter, kroupa, chabrier

Model:
  variant: standard
  imf_type: salpeter
Constants:
Axes:
Sampling:
