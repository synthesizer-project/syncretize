# Parameter file for bpass/generate_incident_grid_2_3.py (BPASS v2.3)
#
#   python generate_incident_grid_2_3.py --config-file bpass-2.3.yaml \
#       --grid-dir <grid-dir> --input-dir <input-dir>
#
# Source data must be downloaded manually (see the script docstring). There
# is one model (bpass_v2.3_imf135_300, binary stars), so Model is empty.
#
# Give alpha_enhancement ([alpha/Fe]) either in Constants, as one of -0.2,
# 0.0, 0.2, 0.4 or 0.6, for a grid at that value, or in Axes, with all five
# values, for a grid with alpha enhancement as an axis:
#
#   Constants:
#     alpha_enhancement: 0.0

Model:
Constants:
Axes:
  - name: alpha_enhancement
    type: values
    values: [-0.2, 0.0, 0.2, 0.4, 0.6]
Sampling:
