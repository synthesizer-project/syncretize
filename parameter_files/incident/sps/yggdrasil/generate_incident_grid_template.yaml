# Template parameter file for src/syncretize/incident/sps/yggdrasil/generate_incident_grid.py
# (Yggdrasil Pop III).
#
# Every key is listed with what it does and its allowed values; copy this file
# and edit it to make a grid.
#
#   python src/syncretize/incident/sps/yggdrasil/generate_incident_grid.py \
#       --config-file parameter_files/incident/sps/yggdrasil/generate_incident_grid_template.yaml \
#       --grid-dir <grid-dir> --input-dir <input-dir> [--download]
#
# Every section must be present, but may be left blank. Unknown keys stop
# the script with an error.
#
# The covering_fraction 1 data are always needed, since every grid uses their
# wavelengths.

# Which model to make
Model:
  population: PopIII.1  # Options: PopIII.1 (Salpeter slope, 50-500 Msun), PopIII.2 (log-normal, M_c = 10 Msun, 1-500 Msun), PopIII_kroupa (Kroupa 2001, 0.1-100 Msun).
  covering_fraction: 0  # Gas covering fraction. Options: 0 (no nebular emission; the incident spectra, for grids to reprocess with Cloudy), 0.5 or 1 (the model's own nebular spectra).
  # grid_name: my-grid  # (Optional) Write <grid-dir>/<grid_name>.hdf5 instead of the name built from the model.

# Fixed parameters
Constants:  # (None for this model)

# Grid axes
Axes:  # (None: the ages and metallicities come from the source data)

# Sobol sampling settings
Sampling:  # (Not used: this script can't Sobol-sample its axes)
