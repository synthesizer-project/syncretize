# FSPS variable-IMF grid configuration
#
# This file defines a contiguous broken power-law initial mass function:
#
#     dN/dM proportional to M^(-alpha_i)
#
# Slopes are ordered. Each slope applies between the mass boundaries at the
# same position and the next position. Four boundaries therefore require three
# slopes. FSPS imf_type=2 fixes the two internal boundaries at 0.5 and 1.0 Msun;
# its lower and upper limits and all three slopes remain configurable.
#
# The mass boundaries are `imf_masses` and the slopes `imf_slopes`, under
# `Constants`. An entry under `Axes` makes one of them an additional
# Synthesizer grid axis. Current production policy permits at most one axis in
# this file. Leaving `Axes` empty creates a normal age-metallicity grid.
#
# An axis has a `name`, a `target` naming the entry it varies (e.g.
# `imf_slopes[2]` or `imf_masses[3]`) and one of the sampling types below. The
# value at the target in `Constants` is the nominal/reference value used in
# the canonical filename and metadata. It must lie within the configured axis.
#
# Explicit values use ordinary YAML list syntax and are preferred for released
# grids because every stored value is visible during review:
#
#   - name: property_name_used_by_synthesizer
#     target: imf_slopes[2]
#     log_on_read: false
#     type: values
#     values:
#       - 1.3
#       - 2.3
#       - 3.0
#
# Generated sampling includes both limits exactly. `type` may be
# `linear-range` or `log-range`; logarithmic spacing requires positive limits:
#
#   - name: property_name_used_by_synthesizer
#     target: imf_slopes[2]
#     log_on_read: false
#     type: linear-range
#     min: 1.3
#     max: 3.0
#     n: 18
#
# `log_on_read` controls interpolation coordinates in Synthesizer. It is
# separate from sampling spacing and defaults to false.
# Slope axes are dimensionless; mass-boundary axis values are interpreted as
# solar masses and written with Msun units.

# Model.libraries (optional) lists the [isochrones, spectra, dust] FSPS
# must have been compiled with; the script stops if they differ.

Model:
  sps_version: "4.0"
  imf_type: bpl

Constants:
  imf_masses: [0.08, 0.5, 1.0, 120.0]
  imf_slopes: [1.3, 2.3, 2.3]

Axes:
  - name: imf_high_mass_slope
    target: imf_slopes[2]
    log_on_read: false
    type: values
    values:
      - 1.3
      - 1.4
      - 1.5
      - 1.6
      - 1.7
      - 1.8
      - 1.9
      - 2.0
      - 2.1
      - 2.2
      - 2.3
      - 2.4
      - 2.5
      - 2.6
      - 2.7
      - 2.8
      - 2.9
      - 3.0

Sampling:
