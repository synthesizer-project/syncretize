# Template parameter file for src/syncretize/incident/sps/fsps/generate_incident_grid_variable_imf.py
# (FSPS with an IMF parameter as an axis).
#
# Every key is listed with what it does and its allowed values; copy this file
# and edit it to make a grid.
#
#   python src/syncretize/incident/sps/fsps/generate_incident_grid_variable_imf.py \
#       --config-file parameter_files/incident/sps/fsps/generate_incident_grid_variable_imf_template.yaml \
#       --grid-dir <grid-dir>
#
# Every section must be present, but may be left blank. Unknown keys stop
# the script with an error.
#
# Needs a working python-FSPS installation (SPS_HOME set). See
# variable_high_mass_slope.yaml and variable_single_slope.yaml for longer
# explanations and the published configurations.

# Which model to make
Model:
  sps_version: "4.0"         # FSPS version. Options: "3.2" (python-fsps 0.4.7) or "4.0" (python-fsps 0.5.0); the script stops if the installed python-fsps differs. Quoted, so it stays a string.
  imf_type: bpl              # IMF. Options: bpl (the only one supported).
  libraries: [mist, c3k_lr]  # The [isochrones, spectra, dust] FSPS was compiled with (trailing ones may be left out); the script stops if FSPS differs. FSPS 4.0 builds MIST and C3K_LR by default. See src/syncretize/incident/sps/fsps/README.md to build others.
  # grid_name: my-grid  # (Optional) Write <grid-dir>/<grid_name>.hdf5 instead of the name built from the model.

# Fixed parameters
Constants:
  imf_masses: [0.08, 0.5, 1.0, 120.0]  # Mass boundaries in Msun: [m_low, m_high] for one slope, or [m_low, 0.5, 1.0, m_high] for three (FSPS fixes the internal 0.5 and 1.0).
  imf_slopes: [1.3, 2.3, 2.3]          # The slopes alpha_i, with dN/dM ~ M^-alpha_i: one slope, or three.

# Grid axes (ages and metallicities come from FSPS). At most one, varying one
# IMF parameter; leave Axes blank for a normal age-metallicity grid.
Axes:
  - name: imf_high_mass_slope                    # Axis name used by synthesizer (not ages or metallicities).
    target: imf_slopes[2]                        # The entry the axis varies: imf_slopes[i], or an outer mass, imf_masses[0] or the last imf_masses entry. Its value in Constants is the nominal one used in the grid name and must lie within the axis.
    type: values                                 # How the axis is sampled. Options: values (an explicit list, preferred for released grids), linear-range or log-range (give min, max and n instead of values; both limits included).
    values: [1.3, 1.5, 1.7, 2.0, 2.3, 2.6, 3.0]  # The axis values, strictly increasing. Slopes are dimensionless; masses are in Msun.
    log_on_read: false                           # (Optional) Interpolate this axis in log space in synthesizer. Default false; positive values only.

# Sobol sampling settings
Sampling:  # (Not used: this script can't Sobol-sample its axes)
