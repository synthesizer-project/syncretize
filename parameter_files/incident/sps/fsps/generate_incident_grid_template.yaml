# Template parameter file for src/syncretize/incident/sps/fsps/generate_incident_grid.py
# (FSPS).
#
# Every key is listed with what it does and its allowed values; copy this file
# and edit it to make a grid.
#
#   python src/syncretize/incident/sps/fsps/generate_incident_grid.py \
#       --config-file parameter_files/incident/sps/fsps/generate_incident_grid_template.yaml \
#       --grid-dir <grid-dir>
#
# Every section must be present, but may be left blank. Unknown keys stop
# the script with an error.
#
# Needs a working python-FSPS installation (SPS_HOME set). The isochrones and
# spectral library are those FSPS was compiled with.

# Which model to make
Model:
  sps_version: "4.0"         # FSPS version. Options: "3.2" (python-fsps 0.4.7) or "4.0" (python-fsps 0.5.0); the script stops if the installed python-fsps differs. Quoted, so it stays a string.
  imf_type: bpl              # IMF. Options: bpl (broken power law) or chabrier03.
  libraries: [mist, c3k_lr]  # The [isochrones, spectra, dust] FSPS was compiled with (trailing ones may be left out); the script stops if FSPS differs. FSPS 4.0 builds MIST and C3K_LR by default. See src/syncretize/incident/sps/fsps/README.md to build others.
  # grid_name: my-grid  # (Optional) Write <grid-dir>/<grid_name>.hdf5 instead of the name built from the model.

# Fixed parameters
Constants:
  imf_masses: [0.08, 0.5, 1, 120]  # IMF mass boundaries in Msun. bpl: [m_low, 0.5, 1.0, m_high] (FSPS fixes the internal ones); chabrier03: [m_low, m_high].
  imf_slopes: [1.3, 2.3, 2.3]      # bpl only: the three slopes alpha_i, with dN/dM ~ M^-alpha_i between consecutive imf_masses.

# Grid axes
Axes:  # (None: the ages and metallicities come from the source data)

# Sobol sampling settings
Sampling:  # (Not used: this script can't Sobol-sample its axes)
