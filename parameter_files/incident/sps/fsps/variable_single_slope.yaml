# FSPS variable single-power-law IMF configuration
#
# This config defines one slope across the complete IMF mass range:
#
#     dN/dM proportional to M^(-alpha)
#
# The generator applies the same configured value to FSPS imf1, imf2, and
# imf3. FSPS's internal 0.5 and 1.0 Msun breaks therefore have no effect.
#
# The slope in `Constants` supplies the nominal IMF used in the canonical
# filename. The `Axes` entry makes this parameter a Synthesizer grid axis. Axis
# points may be supplied as an explicit YAML list, as below, or generated
# using:
#
#     type: linear-range  # linear-range or log-range
#     min: 1.3
#     max: 3.0
#     n: 10
#
# Explicit `values` and generated `min`/`max`/`n` sampling are mutually
# exclusive.
# `log_on_read` controls Synthesizer interpolation coordinates, not sampling.

# Model.libraries (optional) lists the [isochrones, spectra, dust] FSPS
# must have been compiled with; the script stops if they differ.

Model:
  sps_version: "4.0"
  imf_type: bpl

Constants:
  imf_masses: [0.08, 120.0]
  imf_slopes: [2.3]

Axes:
  - name: imf_slope
    target: imf_slopes[0]
    log_on_read: false
    type: values
    values:
      - 1.3
      - 1.4
      - 1.5
      - 1.6
      - 1.7
      - 1.8
      - 1.9
      - 2.0
      - 2.1
      - 2.2
      - 2.3
      - 2.4
      - 2.5
      - 2.6
      - 2.7
      - 2.8
      - 2.9
      - 3.0

Sampling:
