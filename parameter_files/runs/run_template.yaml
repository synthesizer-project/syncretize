# Template run config for the Runner (src/syncretize/runner).
#
# A run makes an incident grid, runs Cloudy on it and assembles the final
# grid, from this one file. Every key is listed with what it does and its
# default; copy this file and edit it to make a grid.
#
#   python -m syncretize.runner run path/to/run.yaml          # as Slurm jobs
#   python -m syncretize.runner run path/to/run.yaml --local  # here
#
# See docs/runner.rst for how a run proceeds.
#
# Run and Incident are required; leave out Cloudy to make only the incident
# grid. Cloudy2, Cloudy3, ... (each like Cloudy, which may also be written
# Cloudy1) run Cloudy on the same incident grid with other set-ups, each
# making its own grid. Unknown keys stop the run with an error. Relative paths are relative
# to this file's directory.
#
# Downloads aren't part of a run (compute nodes may have no internet): run the
# model's script with --download once beforehand.

# Where things go and how the jobs are sized
Run:
  name: blackbody-example        # Name of the run, used to name its jobs. Required.
  work_dir: /path/to/runs/blackbody-example  # Directory for the run's state, job scripts, logs and Cloudy inputs and outputs. Required.
  grid_dir: /path/to/grids       # Directory the incident and final grids are written to. Required.
  input_dir: /path/to/input_data # Directory holding the incident models' source data (e.g. input_data/bc03). Default: none (for models that need none).
  environment: ""                # Shell lines run at the start of every job, e.g. "source software/env.sh". Default: none.

  slurm:                         # Slurm settings for every job (not used with --local)
    partition: cosma8-serial     # Partition to submit to. Default: Slurm's default.
    account: dp004               # Account to charge. Default: Slurm's default.

  incident:                      # The incident job, which makes the whole incident grid
    cores: 1                     # Processes computing the grid's points. Only models with more than one point (FSPS, the black hole models) use more than one. Default: 1.
    walltime: "12:00:00"         # Slurm time limit. Default: 12:00:00.
    memory:                      # Slurm memory, e.g. 8G. Default: Slurm's default.

  cloudy:                        # The Cloudy workers
    workers: 250                 # Most worker jobs per round (one Slurm array; at most 1000 on COSMA). A round has fewer when fewer models are left. Default: 250.
    cores_per_worker: 4          # Cloudy runs per worker at once (Cloudy is single-threaded). Default: 4.
    walltime: "12:00:00"         # Time limit of the first round's workers. Default: 12:00:00.
    walltime_growth: 1.5         # A model stopped by the time limit is requeued, and the next round's limit is multiplied by this (at least 1). Default: 1.5.
    max_walltime: "3-00:00:00"   # The longest time limit (the partition's). Models stopped at this limit stop the grid until it is raised (and the run resumed). Default: 3-00:00:00.
    margin: "00:15:00"           # A worker stops taking models this long before its time limit, or earlier when 1.5 x its longest run so far wouldn't fit (and stops the Cloudy runs left 2 minutes before it, so this must be longer). Default: 00:15:00.
    claim: 1                     # Models a worker takes from the queue at a time. Default: 1.
    max_retries: 2               # Times a failed Cloudy model is rerun (straight away, in the same round) before it is given up. Default: 2.

  assemble:                      # The job assembling the final grid
    cores: 1                     # Cores for the job. Default: 1.
    walltime: "12:00:00"         # Slurm time limit. Default: 12:00:00.
    memory:                      # Slurm memory, e.g. 32G. Default: Slurm's default.

# The incident grid: either model and config, or grid
Incident:
  model: blackholes/blackbody/generate_incident_grid  # The incident model, as its script's path under src/syncretize/incident (e.g. sps/bc03/generate_incident_grid).
  config: /path/to/syncretize/parameter_files/incident/blackholes/blackbody/generate_incident_grid_template.yaml  # The model's parameter file.
  # grid: /path/to/grids/blackbody.hdf5  # Instead of model and config: an existing incident grid to run Cloudy on.

# Cloudy (leave this section out to make only the incident grid)
# Cloudy:
#   config: c23.01-sps           # A shipped Cloudy config name (src/syncretize/cloudy/params) or a path to one. Its output_linelist sets the line list. Required.
#   executable: /cosma/local/cloudy/c23.01  # The Cloudy build directory, holding source/cloudy.exe and data/; if named like a version, it must match the config's cloudy_version. Required.
#   extra_config:                # A second Cloudy config whose parameters replace the first's. Default: none.
#   include_spectra: true        # Store the spectra in the final grid, as well as the lines. Default: true.
#   include_intrinsic_lines: false  # Also store the intrinsic line luminosities. Default: false.
#   perturb:                     # Run models that fail every attempt again either side of their Cloudy parameters, and interpolate them back. Default: off (give this section, or "perturb: true" for the defaults below, to turn it on).
#     step: 0.1                  # How far either side, as a fraction of the gap to the neighbouring grid value of each Cloudy axis. Default: 0.1.
#     log_step: 0.05             # How far either side (dex) for the ionisation parameter of a grid with no Cloudy axes. Default: 0.05.
#     max_steps: 3               # A side that fails is tried again twice as far out, up to this many times in all. Default: 3.
#   remedies:                    # Run crashed models again with numerical changes to their Cloudy parameters, the first whose match (a regular expression) is in why it crashed. Default: the one below; [] for none.
#     - match: grains_qheat      # Cloudy's assertion in grain quantum heating, at low density
#       changes: {grain_qheat: false}
#   review:                      # Pause for a look when many models fail with no remedy left (false: never). Default: on, with these.
#     fraction: 0.1              # ... this fraction of the grid points run
#     slice_fraction: 0.5        # ... or this fraction of those at one value of an axis
#     min_models: 20             # ... once at least this many have run (at that value)

# More Cloudy set-ups for the same incident grid, each making its own grid
# (named after its configs, so each needs different ones)
# Cloudy2:
#   config: c23.01-sps
#   extra_config: /path/to/density-1000.yaml
#   executable: /cosma/local/cloudy/c23.01
